name: Release

# Push a tag vX.Y.Z (on a commit already in main, matching package.json "version") to
# publish a GitHub Release with the built dashboard as `ui-dist.tar.gz`.
# astrq-platform-api ships the release named in its `ui.version` file.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Package
        run: tar -C dist -czf ui-dist.tar.gz .
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ui-dist.tar.gz --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
